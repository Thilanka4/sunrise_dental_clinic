# Test-only configuration: an in-memory H2 database so the test suite never touches
# the real MySQL data. Schema is generated from the @Entity classes (create-drop)
# since H2 doesn't have the hand-applied Phase 6 function/procedure/trigger objects;
# tests that would depend on those (see BillApiControllerTest, PatientHistoryApiControllerTest)
# mock the one component that calls them instead.
spring.datasource.url=jdbc:h2:mem:sunrise_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.thymeleaf.cache=false
