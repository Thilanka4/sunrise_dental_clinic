<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Bill ' + ${bill.appointmentNumber} + ' | Sunrise Dental Clinic'">Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            header, .no-print { display: none !important; }
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>
<main class="container py-5" style="max-width: 640px;">
    <h1 class="h3 mb-4">Bill</h1>
    <dl class="row">
        <dt class="col-sm-4">Appointment number</dt>
        <dd class="col-sm-8" th:text="${bill.appointmentNumber}"></dd>

        <dt class="col-sm-4">Patient name</dt>
        <dd class="col-sm-8" th:text="${bill.patientName}"></dd>

        <dt class="col-sm-4">Treatment</dt>
        <dd class="col-sm-8" th:text="${bill.treatmentName}"></dd>

        <dt class="col-sm-4">Consultation fee</dt>
        <dd class="col-sm-8" th:text="${bill.consultationFee}"></dd>

        <dt class="col-sm-4">Treatment cost</dt>
        <dd class="col-sm-8" th:text="${bill.treatmentCost}"></dd>

        <dt class="col-sm-4">Discount</dt>
        <dd class="col-sm-8" th:text="${bill.discountAmount}"></dd>

        <dt class="col-sm-4">Total</dt>
        <dd class="col-sm-8"><strong th:text="${bill.totalCost}"></strong></dd>

        <dt class="col-sm-4">Issued at</dt>
        <dd class="col-sm-8" th:text="${#temporals.format(bill.issuedAt, 'dd MMM yyyy, HH:mm')}"></dd>
    </dl>
    <div class="no-print d-flex flex-wrap gap-2">
        <a th:href="@{'/appointments/' + ${bill.appointmentNumber}}" class="btn btn-outline-primary">Back to appointment</a>
        <a th:href="@{'/appointments/' + ${bill.appointmentNumber} + '/bill/pdf'}" class="btn btn-success" target="_blank">Download PDF</a>
        <button type="button" class="btn btn-outline-secondary" onclick="window.print()">Print</button>
    </div>
</main>
</body>
</html>
