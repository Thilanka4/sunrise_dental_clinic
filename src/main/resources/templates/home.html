<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Home | Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Sunrise Dental Clinic</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light">Sign out</button>
        </form>
    </div>
</header>
<main class="container py-5">
    <h1 class="h3 mb-4">Staff area</h1>
    <div class="d-flex gap-2 mb-5">
        <a th:href="@{/appointments/new}" class="btn btn-primary">Register New Appointment</a>
        <a th:href="@{/appointments/search}" class="btn btn-outline-primary">Find Appointment</a>
    </div>

    <h2 class="h4 mb-3">Today's Appointments</h2>
    <p th:if="${#lists.isEmpty(todaysAppointments)}" class="text-muted">No appointments scheduled for today.</p>
    <table th:unless="${#lists.isEmpty(todaysAppointments)}" class="table table-striped">
        <thead>
        <tr>
            <th>Time</th>
            <th>Appointment #</th>
            <th>Patient</th>
            <th>Dentist</th>
            <th>Treatment</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="appt : ${todaysAppointments}">
            <td th:text="${#temporals.format(appt.appointmentAt, 'HH:mm')}"></td>
            <td><a th:href="@{'/appointments/' + ${appt.appointmentNumber}}" th:text="${appt.appointmentNumber}"></a></td>
            <td th:text="${appt.patientName}"></td>
            <td th:text="${appt.dentistName}"></td>
            <td th:text="${appt.treatmentName}"></td>
            <td th:text="${appt.status}"></td>
        </tr>
        </tbody>
    </table>

    <h2 class="h4 mb-3 mt-5">Revenue by Treatment Type</h2>
    <p th:if="${#lists.isEmpty(revenueByTreatment)}" class="text-muted">No billed revenue yet.</p>
    <table th:unless="${#lists.isEmpty(revenueByTreatment)}" class="table table-striped" style="max-width: 480px;">
        <thead>
        <tr>
            <th>Treatment</th>
            <th>Total Revenue</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${revenueByTreatment}">
            <td th:text="${entry.treatmentName}"></td>
            <td th:text="${entry.totalRevenue}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
