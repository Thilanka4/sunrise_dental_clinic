<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Home | Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Sunrise Dental Clinic</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light">Sign out</button>
        </form>
    </div>
</header>
<main class="container py-5">
    <h1 class="h3">Staff area</h1>
    <p class="text-muted">Authentication is active. Appointment features will be added in the next phase.</p>
</main>
</body>
</html>
