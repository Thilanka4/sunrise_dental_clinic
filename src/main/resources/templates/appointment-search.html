<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Appointment | Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>
<main class="container py-5" style="max-width: 480px;">
    <h1 class="h3 mb-4">Find Appointment</h1>
    <div th:if="${notFound}" class="alert alert-warning">
        No appointment found with number <span th:text="${searchedNumber}"></span>.
    </div>
    <form th:action="@{/appointments/search}" method="get" class="d-flex gap-2">
        <input type="text" name="appointmentNumber" class="form-control" placeholder="e.g. APT000001" required>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
</main>
</body>
</html>
