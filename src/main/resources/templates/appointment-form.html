<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Appointment | Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand mb-0 h1" th:href="@{/}">Sunrise Dental Clinic</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light">Sign out</button>
        </form>
    </div>
</header>
<main class="container py-5" style="max-width: 640px;">
    <h1 class="h3 mb-4">Register New Appointment</h1>

    <form th:action="@{/appointments}" th:object="${registrationRequest}" method="post" novalidate>
        <div th:if="${#fields.hasErrors('global')}" class="alert alert-danger">
            <div th:each="err : ${#fields.errors('global')}" th:text="${err}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="patientName">Patient name</label>
            <input type="text" class="form-control" id="patientName" th:field="*{patientName}"
                   th:classappend="${#fields.hasErrors('patientName')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('patientName')}" th:errors="*{patientName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input type="text" class="form-control" id="address" th:field="*{address}"
                   th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="contactNumber">Contact number</label>
            <input type="text" class="form-control" id="contactNumber" th:field="*{contactNumber}"
                   th:classappend="${#fields.hasErrors('contactNumber')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="dentistName">Dentist name</label>
            <input type="text" class="form-control" id="dentistName" th:field="*{dentistName}"
                   th:classappend="${#fields.hasErrors('dentistName')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('dentistName')}" th:errors="*{dentistName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="treatmentId">Treatment</label>
            <select class="form-select" id="treatmentId" th:field="*{treatmentId}"
                    th:classappend="${#fields.hasErrors('treatmentId')} ? 'is-invalid'">
                <option value="" disabled selected>Choose a treatment</option>
                <option th:each="t : ${treatments}" th:value="${t.id}"
                        th:text="${t.name + ' (' + t.baseCost + ')'}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('treatmentId')}" th:errors="*{treatmentId}"></div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="appointmentAt">Appointment date &amp; time</label>
            <input type="datetime-local" class="form-control" id="appointmentAt" th:field="*{appointmentAt}"
                   th:classappend="${#fields.hasErrors('appointmentAt')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('appointmentAt')}" th:errors="*{appointmentAt}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Register appointment</button>
        <a th:href="@{/}" class="btn btn-link">Cancel</a>
    </form>
</main>
</body>
</html>
