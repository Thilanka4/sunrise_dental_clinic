<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Appointment ' + ${appointment.appointmentNumber} + ' | Sunrise Dental Clinic'">Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand mb-0 h1" th:href="@{/}">Sunrise Dental Clinic</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light">Sign out</button>
        </form>
    </div>
</header>
<main class="container py-5" style="max-width: 640px;">
    <h1 class="h3 mb-4">Appointment Details</h1>
    <div class="alert alert-danger" th:if="${billError}" th:text="${billError}"></div>
    <dl class="row">
        <dt class="col-sm-4">Appointment number</dt>
        <dd class="col-sm-8" th:text="${appointment.appointmentNumber}"></dd>

        <dt class="col-sm-4">Patient name</dt>
        <dd class="col-sm-8" th:text="${appointment.patientName}"></dd>

        <dt class="col-sm-4">Address</dt>
        <dd class="col-sm-8" th:text="${appointment.address}"></dd>

        <dt class="col-sm-4">Contact number</dt>
        <dd class="col-sm-8" th:text="${appointment.contactNumber}"></dd>

        <dt class="col-sm-4">Dentist</dt>
        <dd class="col-sm-8" th:text="${appointment.dentistName}"></dd>

        <dt class="col-sm-4">Treatment</dt>
        <dd class="col-sm-8" th:text="${appointment.treatmentName}"></dd>

        <dt class="col-sm-4">Treatment cost</dt>
        <dd class="col-sm-8" th:text="${appointment.treatmentCost}"></dd>

        <dt class="col-sm-4">Date &amp; time</dt>
        <dd class="col-sm-8" th:text="${#temporals.format(appointment.appointmentAt, 'dd MMM yyyy, HH:mm')}"></dd>

        <dt class="col-sm-4">Status</dt>
        <dd class="col-sm-8" th:text="${appointment.status}"></dd>
    </dl>
    <a th:href="@{/appointments/search}" class="btn btn-outline-primary">Search another appointment</a>
    <a th:href="@{/appointments/new}" class="btn btn-primary">Register new appointment</a>
    <form th:if="${appointment.status.name() != 'CANCELLED'}"
          th:action="@{'/appointments/' + ${appointment.appointmentNumber} + '/bill'}"
          method="post" class="d-inline">
        <button type="submit" class="btn btn-success">Generate / View Bill</button>
    </form>
</main>
</body>
</html>
