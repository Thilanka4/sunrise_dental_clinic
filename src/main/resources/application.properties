spring.application.name=sunrise-dental-clinic

# Local development defaults. Keep credentials outside version control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sunrise_dental}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.thymeleaf.cache=false

# Development seed credentials. Override both values with environment-specific properties.
app.default-staff.username=${STAFF_DEFAULT_USERNAME:admin}
app.default-staff.password=${STAFF_DEFAULT_PASSWORD:ChangeMe123!}
